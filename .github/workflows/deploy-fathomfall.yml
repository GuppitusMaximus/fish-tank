name: Deploy Fathom Fall to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'FrontEnds/dungeon-fisher/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FrontEnds/dungeon-fisher/package-lock.json

      - name: Build
        working-directory: FrontEnds/dungeon-fisher
        run: npm ci && npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy FrontEnds/dungeon-fisher/dist --project-name=fathomfall
