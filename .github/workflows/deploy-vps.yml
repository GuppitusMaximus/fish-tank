## Install: copy to repo root .github/workflows/deploy-vps.yml
#   cp BackEnds/the-snake-tank/ci/deploy-vps.yml .github/workflows/deploy-vps.yml

name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'BackEnds/the-snake-tank/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: fishtank
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/fishtank
            git pull origin main
            cd BackEnds/the-snake-tank
            .venv/bin/pip install -r requirements.txt
            .venv/bin/python migrate.py
            sudo systemctl restart fishtank-ml fishtank-pvp
