# Kitchen Plan on the homelab host. See deploy/operations.md.
#
# Both listeners are published on the host loopback only; Caddy on the host
# (deploy/Caddyfile) is the only way in: the private app over the tailnet,
# the feed-only route publicly. Settings come from .env next to this file
# (never committed) and the feed token from ./secrets/kitchen-feed-token.
name: kitchen-plan

services:
  kitchen-plan:
    build: .
    image: kitchen-plan:local
    container_name: kitchen-plan
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      KITCHEN_APP_ORIGIN: ${KITCHEN_APP_ORIGIN:?set KITCHEN_APP_ORIGIN (https://<host>.<tailnet>.ts.net) in .env}
      KITCHEN_FEED_PUBLIC_ORIGIN: ${KITCHEN_FEED_PUBLIC_ORIGIN:-}
      KITCHEN_FEED_TOKEN_FILE: /run/secrets/kitchen_feed_token
      KITCHEN_BACKUP_INTERVAL_HOURS: ${KITCHEN_BACKUP_INTERVAL_HOURS:-6}
      KITCHEN_BACKUP_KEEP: ${KITCHEN_BACKUP_KEEP:-28}
    secrets:
      - kitchen_feed_token
    ports:
      - "127.0.0.1:3100:3100" # private app + API, proxied by Caddy on the tailnet address
      - "127.0.0.1:3101:3101" # calendar feed, proxied by Caddy's feed-only public route
    volumes:
      - kitchen-data:/var/lib/kitchen-plan
      - kitchen-backups:/var/backups/kitchen-plan
    stop_grace_period: 20s

volumes:
  kitchen-data:
    name: kitchen-plan-data
  kitchen-backups:
    name: kitchen-plan-backups

secrets:
  kitchen_feed_token:
    file: ./secrets/kitchen-feed-token
