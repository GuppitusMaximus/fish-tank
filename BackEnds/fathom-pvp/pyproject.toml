[project]
name = "fathom-pvp"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.1",
  "uvicorn[standard]==0.41.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "psycopg[binary,pool]==3.2.9",
  "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
